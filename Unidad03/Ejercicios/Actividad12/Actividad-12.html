<!DOCTYPE html>
<html lang="en">
  <head>

    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />

    <title>Actividad 12</title>

  </head>

  <body>
    <div class="container my-5">
      <div class="row justify-content-center align-items-center pb-3 d-flex flex-column text-center">
        <h1>Monumentos para ver en Bizkaia</h1>
        <div class="d-flex justify-content-center">
          <button id="btnOscuro" class="btn bg-dark text-white">Fondo Oscuro</button>
          <button id="btnClaro" class="btn bg-white text-dark">Fondo Claro</button>
        </div>
      </div>
      <div class="row bt-5 justify-content-center">
        <div class="card-columns" id="cards"></div>
      </div>
    </div>
    <script src="Actividad-12.js"></script>

    <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"
    ></script>
  </body>
  <style>
      body {
        transition: background-color 0.5s ease;
      }
      .dark {
        background-color: black;
      }
      .dark h1 {
        color: white;
      }
      .dark .card {
        background-color: #222;
        color: white;
      }
  </style>
</html>
